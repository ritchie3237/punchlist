<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Punchlist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1c2420;
    --muted: #6b7a72;
    --line: #e4e2da;
    --accent: #157a4b;
    --accent-soft: #e3f2ea;
    --danger: #b4533a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614;
      --card: #1a2320;
      --ink: #e8ede9;
      --muted: #8fa197;
      --line: #2a352f;
      --accent: #4ade80;
      --accent-soft: #1d3328;
      --danger: #e08b74;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    padding-bottom: calc(86px + env(safe-area-inset-bottom));
  }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 18px 6px;
    max-width: 640px; margin: 0 auto;
  }
  #quote { font-style: italic; color: var(--muted); font-size: 15px; line-height: 1.4; display: none; margin-bottom: 8px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }

  nav {
    display: flex; gap: 6px; padding: 10px 18px 4px;
    max-width: 640px; margin: 0 auto;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  nav button {
    flex: 1; padding: 9px 4px; font-size: 14px; font-weight: 600;
    border: none; border-radius: 999px; background: transparent; color: var(--muted);
    cursor: pointer; position: relative;
  }
  nav button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  nav .badge {
    position: absolute; top: 1px; right: 8px; min-width: 17px; height: 17px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 11px; line-height: 17px; padding: 0 4px; display: none;
  }

  main { max-width: 640px; margin: 0 auto; padding: 10px 14px; }
  .empty { color: var(--muted); text-align: center; padding: 42px 20px; font-size: 15px; }

  .cat-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 6px 6px; }

  .task {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .task .check {
    width: 26px; height: 26px; border-radius: 999px; border: 2px solid var(--muted);
    background: transparent; flex: none; cursor: pointer; font-size: 15px; line-height: 1;
    color: transparent;
  }
  .task.done-anim .check, .task .check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .task .body { flex: 1; min-width: 0; }
  .task .title { font-size: 16px; line-height: 1.3; overflow-wrap: break-word; }
  .task .title[contenteditable] { outline: none; }
  .task .title.editing { border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  .task.done-anim .title { text-decoration: line-through; color: var(--muted); }
  .task .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .task .due { color: var(--accent); font-weight: 600; }

  .task .actions { display: flex; gap: 8px; flex: none; }
  .task .actions button {
    border: none; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .approve { background: var(--accent-soft); color: var(--accent); }
  .dismiss { background: transparent; color: var(--muted); }
  .undo    { background: transparent; color: var(--muted); font-size: 13px; }

  .event { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; margin-bottom: 8px; align-items: baseline; }
  .event .when { flex: none; width: 84px; }
  .event .when .d { font-weight: 700; font-size: 14px; }
  .event .when .t { font-size: 12.5px; color: var(--muted); }
  .event .name { font-size: 15px; }

  footer { max-width: 640px; margin: 18px auto 0; padding: 0 18px; color: var(--muted); font-size: 12.5px; text-align: center; }

  #addbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  }
  #addbar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  #addinput {
    flex: 1; font-size: 16px; padding: 12px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none;
  }
  #addinput::placeholder { color: var(--muted); }
  #addbtn {
    flex: none; width: 46px; height: 46px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-size: 22px; cursor: pointer; line-height: 1;
  }
  #addbtn:disabled { opacity: .5; }
  #toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <div id="quote"></div>
  <h1>Punch<span>list</span></h1>
</header>

<nav>
  <button data-view="week">Week</button>
  <button data-view="inbox">Inbox<span class="badge" id="inbox-badge"></span></button>
  <button data-view="list" class="active">List</button>
  <button data-view="done">Done</button>
</nav>

<main id="main"><div class="empty">Loading…</div></main>
<footer id="footer"></footer>

<div id="addbar">
  <div class="inner">
    <input id="addinput" type="text" placeholder="Type anything… “grab filters + call re: dock sat”" autocomplete="off">
    <button id="addbtn" title="Add">+</button>
  </div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
var ENDPOINT = window.PUNCHLIST_SCRIPT_URL || "";
var state = { tasks: [], week: [], usage: { month_cost_usd: 0 }, quote: null };
var view = "list";

function $(id) { return document.getElementById(id); }

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.opacity = 0; }, 2200);
}

function post(body) {
  return fetch(ENDPOINT, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}

function load() {
  if (!ENDPOINT) {
    $("main").innerHTML = '<div class="empty">Backend not configured yet — see SETUP.md.</div>';
    return;
  }
  fetch(ENDPOINT + "?action=state")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error || "backend error");
      state = data;
      render();
    })
    .catch(function () {
      $("main").innerHTML = '<div class="empty">Couldn’t reach the backend. Pull to refresh or try again.</div>';
    });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function fmtDue(due) {
  if (!due) return "";
  var d = new Date(due + "T12:00:00");
  if (isNaN(d)) return esc(due);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function render() {
  // quote slot (parked feature — renders when backend supplies one)
  if (state.quote) { $("quote").textContent = "“" + state.quote + "”"; $("quote").style.display = "block"; }

  var inbox = state.tasks.filter(function (t) { return t.status === "inbox"; });
  var badge = $("inbox-badge");
  badge.style.display = inbox.length ? "inline-block" : "none";
  badge.textContent = inbox.length;

  document.querySelectorAll("nav button").forEach(function (b) {
    b.classList.toggle("active", b.dataset.view === view);
  });

  var m = $("main");
  if (view === "week") m.innerHTML = renderWeek();
  else if (view === "inbox") m.innerHTML = renderInbox(inbox);
  else if (view === "done") m.innerHTML = renderDone();
  else m.innerHTML = renderList();

  var cost = (state.usage && state.usage.month_cost_usd) || 0;
  $("footer").textContent = "Claude API spend this month: $" + cost.toFixed(2) + (cost > 0 && cost < 0.005 ? " (fractions of a cent)" : "");

  bindTaskButtons();
}

function renderWeek() {
  if (!state.week.length) return '<div class="empty">Nothing on the calendar this week.</div>';
  return state.week.map(function (ev) {
    return '<div class="event"><div class="when"><div class="d">' + esc(ev.day) + " " + esc(ev.date) +
      '</div><div class="t">' + (ev.time ? esc(ev.time) : "all day") + '</div></div><div class="name">' + esc(ev.title) + "</div></div>";
  }).join("");
}

function renderInbox(inbox) {
  if (!inbox.length) return '<div class="empty">Inbox zero. Suggested tasks from your texts, reminders, and calendar will land here.</div>';
  return inbox.map(function (t) {
    return '<div class="task" data-id="' + t.id + '">' +
      '<div class="body"><div class="title">' + esc(t.title) + '</div>' +
      '<div class="meta">' + esc(t.source || "") + (t.source_detail ? " · " + esc(t.source_detail) : "") + "</div></div>" +
      '<div class="actions"><button class="approve" data-act="open">Add</button>' +
      '<button class="dismiss" data-act="dismissed">✕</button></div></div>';
  }).join("");
}

function renderList() {
  var open = state.tasks.filter(function (t) { return t.status === "open"; });
  if (!open.length) return '<div class="empty">All clear. Add something below, or check the Inbox.</div>';
  var byCat = {};
  open.forEach(function (t) { (byCat[t.category || "Other"] = byCat[t.category || "Other"] || []).push(t); });
  var html = "";
  Object.keys(byCat).sort().forEach(function (cat) {
    html += '<div class="cat-label">' + esc(cat) + "</div>";
    html += byCat[cat].map(function (t) {
      return '<div class="task" data-id="' + t.id + '">' +
        '<button class="check" data-act="done" aria-label="Complete">✓</button>' +
        '<div class="body"><div class="title" data-edit="1">' + esc(t.title) + "</div>" +
        (t.due ? '<div class="meta"><span class="due">' + fmtDue(t.due) + "</span></div>" : "") +
        "</div></div>";
    }).join("");
  });
  return html;
}

function renderDone() {
  var done = state.tasks
    .filter(function (t) { return t.status === "done"; })
    .sort(function (a, b) { return String(b.completed_at).localeCompare(String(a.completed_at)); })
    .slice(0, 50);
  if (!done.length) return '<div class="empty">Nothing checked off yet.</div>';
  return done.map(function (t) {
    var when = t.completed_at ? new Date(t.completed_at).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
    return '<div class="task done-anim" data-id="' + t.id + '">' +
      '<button class="check checked" aria-hidden="true">✓</button>' +
      '<div class="body"><div class="title">' + esc(t.title) + '</div><div class="meta">' + when + "</div></div>" +
      '<div class="actions"><button class="undo" data-act="open">undo</button></div></div>';
  }).join("");
}

function bindTaskButtons() {
  document.querySelectorAll("[data-act]").forEach(function (btn) {
    btn.onclick = function () {
      var el = btn.closest(".task");
      var id = el.dataset.id;
      var status = btn.dataset.act;
      var task = state.tasks.find(function (t) { return t.id === id; });
      if (!task) return;
      var prev = task.status;
      task.status = status;
      if (status === "done") {
        task.completed_at = new Date().toISOString();
        el.classList.add("done-anim");
        setTimeout(render, 350);
      } else {
        render();
      }
      post({ action: "update", id: id, status: status }).then(function (r) {
        if (!r.ok) { task.status = prev; render(); toast("Update failed"); }
      }).catch(function () { task.status = prev; render(); toast("Update failed"); });
    };
  });

  // Tap a List title to edit it in place; Enter or blur saves, Escape cancels.
  document.querySelectorAll('.title[data-edit]').forEach(function (el) {
    el.onclick = function () {
      if (el.isContentEditable) return;
      var id = el.closest(".task").dataset.id;
      var task = state.tasks.find(function (t) { return t.id === id; });
      if (!task) return;
      var original = task.title;
      el.contentEditable = "true";
      el.classList.add("editing");
      el.focus();
      document.execCommand && document.execCommand("selectAll", false, null);

      function finish(save) {
        el.contentEditable = "false";
        el.classList.remove("editing");
        var next = el.textContent.trim();
        if (!save || !next || next === original) { el.textContent = original; return; }
        task.title = next;
        el.textContent = next;
        post({ action: "edit", id: id, title: next }).then(function (r) {
          if (!r.ok) { task.title = original; el.textContent = original; toast("Edit failed"); }
        }).catch(function () { task.title = original; el.textContent = original; toast("Edit failed"); });
      }
      el.onkeydown = function (e) {
        if (e.key === "Enter") { e.preventDefault(); finish(true); el.blur(); }
        else if (e.key === "Escape") { e.preventDefault(); finish(false); el.blur(); }
      };
      el.onblur = function () { if (el.isContentEditable) finish(true); };
    };
  });
}

document.querySelectorAll("nav button").forEach(function (b) {
  b.onclick = function () { view = b.dataset.view; render(); };
});

$("addbtn").onclick = submitAdd;
$("addinput").addEventListener("keydown", function (e) { if (e.key === "Enter") submitAdd(); });

function submitAdd() {
  var input = $("addinput");
  var text = input.value.trim();
  if (!text) return;
  input.value = "";
  $("addbtn").disabled = true;
  toast("Adding…");
  post({ action: "quickadd", text: text })
    .then(function (r) {
      $("addbtn").disabled = false;
      if (!r.ok) { toast("Add failed — try again"); input.value = text; return; }
      (r.added || []).forEach(function (t) {
        state.tasks.push({ id: t.id, title: t.title, category: t.category, status: "open", due: t.due, source: "quickadd" });
      });
      toast(r.added.length > 1 ? "Added " + r.added.length + " tasks" : "Added");
      view = "list";
      render();
      load(); // refresh spend + canonical rows in background
    })
    .catch(function () { $("addbtn").disabled = false; input.value = text; toast("Add failed — offline?"); });
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load();
</script>
</body>
</html>
